<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cookie Preferences</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f6f8;
    color:#202124;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.cookie-box{
    width:min(700px, calc(100% - 36px));
    background:#fff;
    padding:42px;
    border-radius:14px;
    box-shadow:0 8px 35px rgba(0,0,0,.10);
}

.cookie-title{
    font-size:28px;
    font-weight:600;
    margin-bottom:20px;
}

.cookie-text{
    font-size:16px;
    line-height:1.7;
    color:#5f6368;
    margin-bottom:12px;
}

.cookie-note{
    font-size:15px;
    line-height:1.6;
    color:#5f6368;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:12px;
    margin-bottom:22px;
}

button{
    border:none;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    padding:13px 25px;
    border-radius:8px;
    transition:.2s;
}

.accept{
    background:#2563eb;
    color:#fff;
}

.accept:hover{
    background:#1d4ed8;
}

.reject{
    background:#e9eaed;
    color:#202124;
}

.reject:hover{
    background:#dadce0;
}

.privacy{
    background:none;
    padding:0;
    color:#2563eb;
    font-size:14px;
    font-weight:400;
    text-decoration:underline;
}

.privacy:hover{
    color:#174ea6;
}

/* JUMPSCARE */
.jumpscare{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
    display:none;
    z-index:999999;
    overflow:hidden;
}

.jumpscare video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border:0;
    outline:none;
}

@media(max-width:600px){
    .cookie-box{
        padding:28px 22px;
    }

    .cookie-title{
        font-size:23px;
    }

    .cookie-text{
        font-size:14px;
    }

    .cookie-note{
        font-size:13px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    .privacy{
        width:auto;
    }
}
</style>
</head>

<body>

<div class="cookie-box" id="cookieBox">

    <h1 class="cookie-title">
        Cookie dan konten buatan pengguna
    </h1>

    <p class="cookie-text">
        Situs web ini menggunakan cookie untuk menyajikan informasi
        yang paling relevan bagi Anda dan untuk lebih memahami cara
        Anda menggunakan situs web ini.
    </p>

    <p class="cookie-note">
        Harap terima cookie demi kinerja yang optimal.
    </p>

    <div class="buttons">
        <button class="accept" onclick="startJumpscare()">
            Menerima
        </button>

        <button class="reject" onclick="startJumpscare()">
            Menolak
        </button>
    </div>

    <button class="privacy" onclick="startJumpscare()">
        Kebijakan privasi
    </button>

</div>


<!-- JUMPSCARE -->
<div class="jumpscare" id="jumpscare">

    <video
        id="jumpscareVideo"
        src="jumpscare.mp4"
        loop
        playsinline
        preload="auto">
    </video>

</div>


<script>

function startJumpscare(){

    const cookieBox = document.getElementById("cookieBox");
    const jumpscare = document.getElementById("jumpscare");
    const video = document.getElementById("jumpscareVideo");

    // Hilangkan halaman cookie
    cookieBox.style.display = "none";

    // Tampilkan video
    jumpscare.style.display = "block";

    // Karena dipanggil setelah klik,
    // browser mengizinkan video dengan suara
    video.muted = false;
    video.volume = 1;

    video.currentTime = 0;

    video.play().catch(error => {
        console.log("Video gagal dimainkan:", error);
    });

    // Minta fullscreen setelah klik user
    if(document.documentElement.requestFullscreen){

        document.documentElement.requestFullscreen()
        .catch(error => {
            console.log("Fullscreen ditolak browser:", error);
        });

    }
}

</script>

</body>
</html>
