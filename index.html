<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Security Warning</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#c92b1d;
    color:white;
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:100%;
    max-width:1400px;
    height:100vh;
    padding:clamp(20px, 3vw, 55px)
            clamp(25px, 5vw, 90px);

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.warning-icon{
    width:clamp(55px, 7vw, 80px);
    margin-bottom:30px;
    animation:pulse 2s infinite;
}

h1{
    font-size:clamp(28px, 4vw, 52px);
    font-weight:500;
    margin-bottom:18px;
    letter-spacing:-1px;
    line-height:1.1;
}

.desc{
    max-width:950px;
    font-size:clamp(15px, 1.6vw, 22px);
    line-height:1.6;
    color:#f3f3f3;
    margin-bottom:38px;
}

.report{
    display:flex;
    align-items:flex-start;
    gap:14px;
    font-size:15px;
    color:#f2f2f2;
    margin-bottom:42px;
}

.report label{
    line-height:1.7;
}

.underline{
    text-decoration:underline;
    cursor:pointer;
}

.custom-checkbox{
    position:relative;
    width:18px;
    height:18px;
    min-width:18px;
    margin-top:4px;
}

.custom-checkbox input{
    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
    z-index:2;
}

.checkmark{
    position:absolute;
    top:0;
    left:0;
    width:18px;
    height:18px;
    border:2px solid #fff;
    background:transparent;
}

.checkmark::after{
    content:"";
    position:absolute;
    display:none;
    left:4px;
    top:0;
    width:5px;
    height:10px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
}

.custom-checkbox input:checked + .checkmark::after{
    display:block;
}

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.details{
    font-size:17px;
    letter-spacing:1px;
    cursor:pointer;
    opacity:.95;
}

.details:hover{
    opacity:1;
}

.safe-btn{
    background:#d67d73;
    border:none;
    color:white;
    font-size:18px;
    padding:17px 42px;
    cursor:pointer;
    transition:.25s;
}

.safe-btn:hover{
    background:#e48f85;
}

.details-box{
    display:none;
    margin-top:22px;
    max-width:1000px;
    color:#f1f1f1;
    line-height:1.7;
    font-size:16px;
    animation:fadeIn .3s ease;
}


/* =========================
   JUMPSCARE
========================= */

.jumpscare{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    background:#000;

    display:none;

    z-index:999999;

    overflow:hidden;
}

.jumpscare video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border:0;

    outline:none;
}


/* =========================
   ANIMATION
========================= */

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    body{
        align-items:flex-start;
        overflow:hidden;
    }

    .container{
        padding:22px 18px;
    }

    .warning-icon{
        width:48px;
        margin-bottom:22px;
    }

    h1{
        font-size:28px;
        line-height:1.2;
        margin-bottom:15px;
    }

    .desc{
        font-size:14px;
        line-height:1.6;
        margin-bottom:28px;
    }

    .report{
        font-size:13px;
        gap:10px;
        margin-bottom:30px;
    }

    .custom-checkbox{
        width:15px;
        height:15px;
        min-width:15px;
    }

    .checkmark{
        width:15px;
        height:15px;
    }

    .checkmark::after{
        left:3px;
        top:-1px;
        width:4px;
        height:8px;
    }

    .bottom{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
    }

    .details{
        font-size:13px;
    }

    .safe-btn{
        width:100%;
        font-size:14px;
        padding:13px;
    }

    .details-box{
        font-size:13px;
        line-height:1.5;
        margin-top:18px;
    }

}

</style>
</head>

<body>


<!-- =========================
     SECURITY PAGE
========================= -->

<div class="container">

    <img
        src="https://i.ibb.co.com/9kLCC4Sv/warning.png"
        class="warning-icon"
        alt="Warning"
    >

    <h1>
        Security Warning
    </h1>

    <p class="desc">
        This page contains a security notice.
        Please review the information below before continuing.
    </p>


    <div class="report">

        <label class="custom-checkbox">

            <input
                type="checkbox"
                checked
            >

            <span class="checkmark"></span>

        </label>


        <label>

            <span class="underline report-link">
                Automatically report
            </span>

            details of possible security incidents.

            <span class="underline privacy-link">
                Privacy Policy
            </span>

        </label>

    </div>


    <div class="bottom">

        <div class="details">
            DETAILS
        </div>


        <button
            class="safe-btn"
            onclick="goBack()"
        >
            Back to safety
        </button>

    </div>


    <div class="details-box">

        <p>
            This is a harmless prank page.
            No files are installed, deleted,
            or modified on your device.
        </p>

        <br>

        <p>
            The page will continue automatically.
        </p>

    </div>

</div>



<!-- =========================
     JUMPSCARE
========================= -->

<div
    class="jumpscare"
    id="jumpscare"
>

    <video
        id="jumpscareVideo"

        src="jumpscare.mp4"

        autoplay
        loop

        muted
        playsinline

        preload="auto"

        disablepictureinpicture

        controlslist="
            nodownload
            noplaybackrate
            noremoteplayback
        "
    ></video>

</div>



<script>


/* =========================
   BACK TO SAFETY
========================= */

function goBack(){

    window.location.href =
        "https://google.com";

}



/* =========================
   DETAILS
========================= */

document
.querySelector(".details")
.addEventListener("click", () => {

    const box =
        document.querySelector(".details-box");


    if(box.style.display === "block"){

        box.style.display = "none";

    }else{

        box.style.display = "block";

    }

});



/* =========================
   REPORT LINK
========================= */

document
.querySelector(".report-link")
.addEventListener("click", () => {

    window.location.href =
        "https://developers.google.com/search/help/report-quality-issues";

});



/* =========================
   PRIVACY LINK
========================= */

document
.querySelector(".privacy-link")
.addEventListener("click", () => {

    window.location.href =
        "https://policies.google.com/privacy";

});



/* =========================
   JUMPSCARE
========================= */

window.addEventListener("load", () => {


    setTimeout(async () => {


        const scare =
            document.getElementById("jumpscare");


        const video =
            document.getElementById("jumpscareVideo");


        /* SHOW FULLSCREEN OVERLAY */

        scare.style.display = "block";


        /* START VIDEO */

        try{

            await video.play();

        }catch(error){

            console.log(
                "Autoplay diblokir browser:",
                error
            );

        }


        /* REQUEST FULLSCREEN */

        try{

            if(document.documentElement.requestFullscreen){

                await document
                    .documentElement
                    .requestFullscreen();

            }

        }catch(error){

            console.log(
                "Fullscreen diblokir browser:",
                error
            );

        }


    }, 1000);

});



/* =========================
   KEEP VIDEO PLAYING
========================= */

const video =
    document.getElementById("jumpscareVideo");


video.addEventListener("pause", () => {

    video.play().catch(() => {});

});


video.addEventListener("ended", () => {

    video.currentTime = 0;

    video.play().catch(() => {});

});

</script>

</body>
</html>
